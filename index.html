<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive UI Test</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<header class="header">
    <div class="header-content">
        <div class="header-main">
            <h1>Welcome to "What Animal Is That?!"</h1>
        </div>
        <div class="header-sub">
            <h2>Click an animal name to see what it is!</h2>
        </div>  
    </div>
</header>
<main class="body">
<button type="button" id="btn-cat" class="btn">Reveal a CAT</button>
<img src="" alt="">
<button type="button" id="btn-dog" class="btn">Reveal a DOG</button>
<button type="button" id="btn-cow" class="btn">Reveal a COW</button>
</main>
</body>

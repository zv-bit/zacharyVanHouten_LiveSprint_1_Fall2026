<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive UI Test</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<header class="header">
    <div class="header-content">
        <h1 class="header-main">Welcome to "What Animal Is That?!"</h1>
        <p class="header-sub">Click an animal name to see what it is!</p>  
    </div>
</header>
<main class="body">

    <div class="picture hidden" id="cat-wrapper">
        <img class="animal" src="tabby-cat.jpg" alt="This is a cat!">
        <button type="button" id="hide-cat" class="btn hdn-btn"> Hide Results</button>
    </div>
    <button type="button" id="btn-cat" class="btn cat-btn">Reveal a CAT</button>

    <div class="picture hidden" id="dog-wrapper">
        <img class="animal" src="dog.jpg" alt="This is a dog!">
        <button type="button" id="hide-dog" class="btn hdn-btn"> Hide Results</button>
    </div>
    <button type="button" id="btn-dog" class="btn dog-btn">Reveal a DOG</button>

    <div class="picture hidden" id="cow-wrapper">
        <img class="animal" src="cow.jpg" alt="This is a cow!">
        <button type="button" id="hide-cow" class="btn hdn-btn"> Hide Results</button>
    </div>
    <button type="button" id="btn-cow" class="btn cow-btn">Reveal a COW</button>

</main>
<script src="app.js"></script>
</body>
</html>

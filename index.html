<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive UI Test</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<header class="header">
    <div class="header-content">
        <div class="header-main">
            <h1>Welcome to "What Animal Is That?!"</h1>
        </div>
        <div class="header-sub">
            <h2>Click an animal name to see what it is!</h2>
        </div>  
    </div>
</header>
<main class="body">

    <div class="animal hidden" id="cat-wrapper">
        <img src="tabby-cat.jpg" alt="This is a cat!">
    </div>
    <button type="button" id="btn-cat" class="btn cat-btn">Reveal a CAT</button>

    <div class="animal hidden" id="dog-wrapper">
        <img src="dog.jpg" alt="This is a dog!">
    </div>
    <button type="button" id="btn-dog" class="btn dog-btn">Reveal a DOG</button>

    <div class="animal hidden" id="cow-wrapper">
        <img src="cow.jpg" alt="This is a cow!">
    </div>
    <button type="button" id="btn-cow" class="btn cow-btn">Reveal a COW</button>

</main>
<script src="app.js"></script>
</body>
</html>
